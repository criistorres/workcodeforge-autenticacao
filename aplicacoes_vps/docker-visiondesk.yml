networks:
  traefik_network:
    external: true
    name: n8nhub_traefik_network
  gestaocrm_network:
    driver: bridge

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: gestaocrm_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestaocrm}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
      -c log_statement=none
      -c log_min_duration_statement=1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-gestaocrm}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gestaocrm_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: gestaocrm_redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 60
      --timeout 300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gestaocrm_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # MinIO para armazenamento de arquivos
  minio:
    image: minio/minio:latest
    container_name: gestaocrm_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
      MINIO_CACHE_DRIVES: /tmp/cache
      MINIO_CACHE_EXCLUDE: "*.pdf,*.mp4"
      MINIO_CACHE_QUOTA: 80
      MINIO_CACHE_AFTER: 3
      MINIO_CACHE_WATERMARK_LOW: 70
      MINIO_CACHE_WATERMARK_HIGH: 90
    volumes:
      - minio_data:/data
      - minio_cache:/tmp/cache
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gestaocrm_network
      - traefik_network
    labels:
      - "traefik.enable=true"
      # MinIO API
      - "traefik.http.routers.minio-api.rule=Host(`minio-visiondesk.codeforgeit.com.br`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=myresolver"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      # MinIO Console
      - "traefik.http.routers.minio-console.rule=Host(`minio-console-visiondesk.codeforgeit.com.br`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=myresolver"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      - "traefik.docker.network=n8nhub_traefik_network"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Inicialização do Banco (Prisma DB Push e Generate)
  # db_init:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: gestaocrm_db_init
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-gestaocrm}
  #   command: sh -c "npx prisma db push --accept-data-loss && npx prisma generate"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - gestaocrm_network
  #   restart: "no"

  # Backend Node.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestaocrm_backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-gestaocrm}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REDIS_URL: redis://redis:6379
      # Configurações MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-gestaocrm-files}
      # Configurações de Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10000}
      # Configurações CORS
      CORS_ORIGIN: https://visiondesk.codeforgeit.com.br
      CORS_CREDENTIALS: true
      # Configurações de performance do Node.js
      NODE_OPTIONS: "--max-old-space-size=512"
      UV_THREADPOOL_SIZE: 16
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # db_init:
      #   condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gestaocrm_network
      - traefik_network
    volumes:
      - ./backend/logs:/app/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gestaocrm-backend.rule=Host(`visiondesk.codeforgeit.com.br`) && (PathPrefix(`/api`) || Path(`/health`))"
      - "traefik.http.routers.gestaocrm-backend.entrypoints=websecure"
      - "traefik.http.routers.gestaocrm-backend.tls.certresolver=myresolver"
      - "traefik.http.routers.gestaocrm-backend.priority=100"
      - "traefik.http.services.gestaocrm-backend.loadbalancer.server.port=3001"
      - "traefik.docker.network=n8nhub_traefik_network"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://visiondesk.codeforgeit.com.br/api
    container_name: gestaocrm_frontend
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gestaocrm-frontend.rule=Host(`visiondesk.codeforgeit.com.br`)"
      - "traefik.http.routers.gestaocrm-frontend.entrypoints=websecure"
      - "traefik.http.routers.gestaocrm-frontend.tls.certresolver=myresolver"
      - "traefik.http.routers.gestaocrm-frontend.priority=1"
      - "traefik.http.services.gestaocrm-frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=n8nhub_traefik_network"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  minio_cache:
    driver: local
